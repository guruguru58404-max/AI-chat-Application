<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat Application</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:0 auto;padding:16px;background:#f3f6f4}
h1{font-size:1.3rem}
#key,#input{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
#chat{background:#fff;border:1px solid #ccc;border-radius:8px;height:50vh;overflow-y:auto;padding:10px;margin:10px 0}
.me{background:#1f6f54;color:#fff;padding:8px 12px;border-radius:10px;margin:6px 0 6px auto;width:fit-content;max-width:85%}
.bot{background:#e8efeb;padding:8px 12px;border-radius:10px;margin:6px 0;width:fit-content;max-width:85%;white-space:pre-wrap}
button{padding:10px 18px;background:#1f6f54;color:#fff;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>AI Chat Application</h1>
<input id="key" type="password" placeholder="Paste your API key here">
<div id="chat"></div>
<input id="input" placeholder="Type your message and press Send">
<button id="send">Send</button>
<script>
var history = [];
var chat = document.getElementById('chat');
function add(t, c) {
  var d = document.createElement('div');
  d.className = c;
  d.textContent = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send() {
  var inp = document.getElementById('input');
  var key = document.getElementById('key').value.trim();
  var text = inp.value.trim();
  if (!text) return;
  if (!key) { add('Paste your API key first.', 'bot'); return; }
  inp.value = '';
  add(text, 'me');
  history.push({ role: 'user', content: text });
  var p = add('Thinking...', 'bot');
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: history })
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error.message);
    var reply = data.content[0].text;
    p.textContent = reply;
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    p.textContent = 'Error: ' + e.message;
    history.pop();
  }
}
document.getElementById('send').onclick = send;
document.getElementById('input').onkeydown = function (e) { if (e.key === 'Enter') send(); };
</script>
</body>
</html>
